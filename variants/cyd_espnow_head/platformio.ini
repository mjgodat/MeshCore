; ----------- CYD ESP-NOW Repeater Head ------------
; A wireless head for a headless repeater: a companion whose only radio is
; ESP-NOW, reaching LoRa through the repeater's raw-format ESP-NOW bridge.
; Board: ESP32-2432S028 "Cheap Yellow Display" (ESP32-D0WD, 4 MB, no PSRAM).

[CYD_ESPNOW_Head]
extends = esp32_base
board = esp32dev
; Companion + UI does not fit the 1.25 MiB default app slots; this head has no
; WiFi OTA, so trade the second slot for one 3 MiB app.
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/cyd_espnow_head
  -D MESH_PRIMARY_ESPNOW=1
  ; The repeater's ESP-NOW bridge (and WiChat) share channel 6.
  -D MESH_ESPNOW_CHANNEL=6
  -D DISABLE_WIFI_OTA=1
  ; Optional UDP transport (HeadLinkRadio): off until `set transport` selects
  ; udp, both or auto; ESP-NOW only by default.
  -D HEAD_UDP_TRANSPORT=1
  ; Power saving sleeps the WiFi radio, so the head hears nothing over
  ; ESP-NOW. Fresh installs start with it off.
  -D COMPANION_POWERSAVING_DEFAULT=0
  ; The bridge never echoes the head's own floods back, so retries can't
  ; confirm anything; keep one for a lost frame.
  -D COMPANION_FLOOD_RETRY_DEFAULT=1
  ; Login/CLI replies come back through the bridge's queue and the repeater's
  ; processing (~1.5 s measured); don't give up after the airtime estimate.
  -D COMPANION_REPLY_TIMEOUT_FLOOR_MS=5000
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  ; Display: 320x240 panel, MeshCore's standard 160x120 layout drawn at 2x
  ; (same scaling as the 320x240 Wio Tracker L2).
  -D DISPLAY_CLASS=CYDDisplay
  -D DISPLAY_ROTATION=1
  -D DISPLAY_BRIGHTNESS=200
  -D UI_ZOOM=2
  -D HAS_TOUCH
  -D TOUCH_CENTER_ZONE_PERCENT=50
  -D PIN_USER_BTN=0
  -D UI_MESSAGES_HOME_PAGE=1
  -D AUTO_OFF_MILLIS=300000UL
  ; USB-powered most of the time: use the timeout literally.
  -D UI_USB_AUTO_OFF_MULTIPLIER=1UL
  ; Screen off 2 min after the last touch (fresh installs; the companion
  ; carousel's Screen page changes it: 30 s / 1 / 2 / 5 min / Never).
  -D HEAD_DISPLAY_TIMEOUT_S=120
  -D UI_NO_HIBERNATE
  -D UI_RECENT_LIST_SIZE=9
  ; Head-only screens: touch compose with "Send as".
  -D UI_REPEATER_HEAD=1
  ; No RTC battery: take time from mesh consensus (adverts and channel posts
  ; from at least three independent sources) soon after boot.
  -D COMPANION_MESH_CLOCK_SYNC=1
  -D MESH_CLOCK_SYNC_STARTUP_DELAY_MILLIS=30000ULL
  -D MESH_CLOCK_SYNC_REQUIRED_SAMPLES_DEFAULT=3
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/esp32/HeadLinkRadio.cpp>
  +<helpers/esp32/WiFiStationDiagnostics.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/cyd_espnow_head>
lib_deps = ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
; Windows: the framework include paths plus the head's push the compiler
; command past the 32,767-character limit; shorten them with -iprefix.
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:variants/m5stack_cardputer_adv/win_long_cmdline.py

; Mesh-only head (no WiChat).
[env:CYD_ESPNOW_Head_companion_usb]
extends = CYD_ESPNOW_Head
build_flags =
  ${CYD_ESPNOW_Head.build_flags}
  -I examples/companion_radio/ui-new
  ; Static DRAM on the classic ESP32 is the limit once the display is in.
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  ; The offline queue only feeds a phone/PC app's message sync; the head shows
  ; messages on its own screen, misses nothing it could catch up on (nobody
  ; stores messages for it while off), and on overflow drops the oldest frame
  ; (UI_REPEATER_HEAD). 128 frames cost ~22.6 KB of static DRAM; 8 keep ~1.4 KB.
  -D OFFLINE_QUEUE_SIZE=8
  ; One-key DM holding waits for acceptance in a phone app, which the head
  ; doesn't have (~5.3 KB). Ordinary contact DMs are unaffected; recipients
  ; need the head's advert (send a flood advert) before they can decrypt.
  -D MESH_ENABLE_ONE_KEY_DM=0
  ; Programmable alert engine for app notifications (~2.8 KB); unused here.
  -D COMPANION_FEATURE_NOTIFICATIONS=0
  -D ENABLE_USB_INTERFACE
  ; Visual head (the Freenove head's pages on the 2.8" screen):
  ; HOME, TELEMETRY, MAP, NODES and HEAD (= the companion UI above), drawn
  ; in 320 x 40 bands (no PSRAM, no full-screen buffer). Observer frames from
  ; the M5 and the packets the head receives itself feed the model, kept in
  ; internal RAM (64 nodes, 128 packets).
  -I examples/companion_radio/ui-freenove
  -D FREENOVE_VISUAL_HEAD=1
  -D HMI_PROFILE_CYD=1
  -D HMI_MODEL_NODES=64
  -D HMI_MODEL_FEED=128
  ; The page task renders in short bursts (<= 15 fps) ahead of the
  ; companion loop, which otherwise takes every other time slice.
  -D HMI_TASK_PRIORITY=2
  ; Messages as a conversation list + scrollable threads (HeadChats.h), as
  ; on the Freenove head; whole messages kept (161 B each, heap).
  -D UI_HEAD_CHAT_LIST=1
  -D UI_MSG_PREVIEW_SIZE=161
  ; Settings list and repeater picker: 5 rows of 28 px on the HEAD page.
  -D UI_HEAD_LIST_ROWS=5
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${CYD_ESPNOW_Head.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<../examples/companion_radio/ui-freenove/FrameBuffer332.cpp>
  +<../examples/companion_radio/ui-freenove/FbFonts.cpp>
  +<../examples/companion_radio/ui-freenove/FrameBuffer565.cpp>
  +<../examples/companion_radio/ui-freenove/FbFontsAA.cpp>
  +<../examples/companion_radio/ui-freenove/MeshModel.cpp>
  +<../examples/companion_radio/ui-freenove/StubPages.cpp>
  +<../examples/companion_radio/ui-freenove/HomePage.cpp>
  +<../examples/companion_radio/ui-freenove/TelemetryPage.cpp>
  +<../examples/companion_radio/ui-freenove/MapPage.cpp>
  +<../examples/companion_radio/ui-freenove/NodesPage.cpp>
  +<../examples/companion_radio/ui-freenove/NodeCard.cpp>
  +<../examples/companion_radio/ui-freenove/FreenoveUITask.cpp>
lib_deps =
  ${CYD_ESPNOW_Head.lib_deps}
  densaugeo/base64 @ ~1.4.0

; On-device UI tests: the product head, but the USB serial (CH340, 921600
; baud) is a text test console (ui-freenove/UiTestConsole.cpp: tap / swipe /
; shot / page / status / stats / bars / log / contacts / inject) instead of
; the companion protocol. Host side: .superpowers/uitest/ui.py. Not for
; daily use.
[env:CYD_ESPNOW_Head_uitest]
extends = env:CYD_ESPNOW_Head_companion_usb
build_unflags = -D ENABLE_USB_INTERFACE
build_flags =
  ${env:CYD_ESPNOW_Head_companion_usb.build_flags}
  -D FREENOVE_UITEST=1
  -D UITEST_BAUD=921600
build_src_filter = ${env:CYD_ESPNOW_Head_companion_usb.build_src_filter}
  +<../examples/companion_radio/ui-freenove/UiTestConsole.cpp>
