; ----------- Freenove ESP32-S3 3.5" ESP-NOW Repeater Head ------------
; The CYD head's job (a companion whose only radio is ESP-NOW, reaching LoRa
; through the repeater's raw-format ESP-NOW bridge) on the Freenove FNK0104N:
; ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, native USB-CDC, ST77922 3.5" QSPI
; 320x480 panel with integrated I2C touch (used as 480x320 landscape).

[Freenove_S3_35_Head]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Two 6.25 MB app slots (OTA-capable) + 3.4 MB SPIFFS.
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/freenove_s3_35_head
  -I examples/companion_radio/ui-freenove
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; "freenove: boot" + reset reason first thing in setup(); backlight on
  ; from a static constructor (BootBeacon.h) so a failed start is never dark.
  -D FREENOVE_BOOT_BREADCRUMB=1
  -D MESH_PRIMARY_ESPNOW=1
  ; The repeater's ESP-NOW bridge (and WiChat) share channel 6.
  -D MESH_ESPNOW_CHANNEL=6
  -D DISABLE_WIFI_OTA=1
  ; Same head defaults as the CYD head (see variants/cyd_espnow_head).
  -D COMPANION_POWERSAVING_DEFAULT=0
  -D COMPANION_FLOOD_RETRY_DEFAULT=1
  -D COMPANION_REPLY_TIMEOUT_FLOOR_MS=5000
  ; Wire = the touch/codec bus (SDA 38, SCL 39). Never leave Wire on the S3
  ; defaults: GPIO 9 is the panel's QSPI D3.
  -D PIN_BOARD_SDA=38
  -D PIN_BOARD_SCL=39
  ; Display: 480x320 landscape, MeshCore's standard layout drawn at 2x.
  -D DISPLAY_CLASS=FreenoveDisplay
  -D DISPLAY_ROTATION=0
  -D DISPLAY_BRIGHTNESS=200
  -D UI_ZOOM=2
  -D HAS_TOUCH
  -D TOUCH_CENTER_ZONE_PERCENT=50
  -D PIN_USER_BTN=0
  -D UI_MESSAGES_HOME_PAGE=1
  -D AUTO_OFF_MILLIS=300000UL
  -D UI_USB_AUTO_OFF_MULTIPLIER=1UL
  ; Screen off 2 min after the last touch (fresh installs; the companion
  ; carousel's Screen page changes it: 30 s / 1 / 2 / 5 min / Never).
  -D HEAD_DISPLAY_TIMEOUT_S=120
  ; On-screen keyboard: the PC layout (shift key, 123 / #+= pages); the CYD
  ; keeps the three-mode key (TouchKeyboard.h).
  -D TOUCH_KEYBOARD_PC_LAYOUT=1
  -D UI_NO_HIBERNATE
  -D UI_RECENT_LIST_SIZE=9
  ; Head-only screens: touch compose with "Send as".
  -D UI_REPEATER_HEAD=1
  ; Messages as a conversation list + scrollable threads (HeadChats.h),
  ; whole messages kept (161 B each, the store is on the PSRAM heap).
  -D UI_HEAD_CHAT_LIST=1
  -D UI_MSG_PREVIEW_SIZE=161
  -D COMPANION_MESH_CLOCK_SYNC=1
  -D MESH_CLOCK_SYNC_STARTUP_DELAY_MILLIS=30000ULL
  -D MESH_CLOCK_SYNC_REQUIRED_SAMPLES_DEFAULT=3
  ; Hardware fix-ups for bring-up (see README): rotate landscape 180 degrees,
  ; MADCTL override, touch mirror bits.
  ; -D FREENOVE_LANDSCAPE_FLIP=1
  ; -D FREENOVE_MADCTL=0x00
  ; -D FREENOVE_TOUCH_MIRROR=0
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/freenove_s3_35_head>
  +<../examples/companion_radio/ui-freenove/FrameBuffer332.cpp>
  +<../examples/companion_radio/ui-freenove/FbFonts.cpp>
  +<../examples/companion_radio/ui-freenove/FrameBuffer565.cpp>
  +<../examples/companion_radio/ui-freenove/FbFontsAA.cpp>
lib_deps = ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
; Windows: ~200 framework include paths push the compiler command past the
; 32,767-character limit; shorten them with -iprefix (shared helper).
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:variants/m5stack_cardputer_adv/win_long_cmdline.py

; Mesh-only head with the CYD head's screens (no WiChat).
[env:Freenove_S3_35_Head_companion_usb]
extends = Freenove_S3_35_Head
build_flags =
  ${Freenove_S3_35_Head.build_flags}
  -I examples/companion_radio/ui-new
  ; CYD-head trims (static DRAM). The S3 has more internal RAM, but these
  ; keep the head's footprint identical to the CYD head's until measured.
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=8
  -D MESH_ENABLE_ONE_KEY_DM=0
  -D COMPANION_FEATURE_NOTIFICATIONS=0
  -D ENABLE_USB_INTERFACE
  ; Visual head pages (FreenoveUITask): HOME, TELEMETRY, MAP, NODES and HEAD
  ; (= the companion UI above). Observer frames from the M5 and the packets
  ; the head receives itself feed the model.
  -D FREENOVE_VISUAL_HEAD=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${Freenove_S3_35_Head.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<../examples/companion_radio/ui-freenove/MeshModel.cpp>
  +<../examples/companion_radio/ui-freenove/StubPages.cpp>
  +<../examples/companion_radio/ui-freenove/HomePage.cpp>
  +<../examples/companion_radio/ui-freenove/TelemetryPage.cpp>
  +<../examples/companion_radio/ui-freenove/MapPage.cpp>
  +<../examples/companion_radio/ui-freenove/NodesPage.cpp>
  +<../examples/companion_radio/ui-freenove/NodeCard.cpp>
  +<../examples/companion_radio/ui-freenove/FreenoveUITask.cpp>
lib_deps =
  ${Freenove_S3_35_Head.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Hardware bring-up: boot shows the panel test pattern (8 colour bars + corner
; markers) for 6 s, then the RGB332 framebuffer demo (FreenoveDemo.h: glow
; dots, marching dashed line, text; anim/idle/full modes) logs fps and push
; bytes/frame over USB once per second; every touch is printed over USB.
[env:Freenove_S3_35_Head_companion_bringup]
extends = env:Freenove_S3_35_Head_companion_usb
build_flags =
  ${env:Freenove_S3_35_Head_companion_usb.build_flags}
  -D FREENOVE_BRINGUP=1
  ; Labelled colour bars through the RGB565 and RGB332 paths after the test
  ; pattern (3 x 2 frames, 3 s each): settles panel colour questions.
  -D FREENOVE_COLOUR_CHECK=1

; On-device UI tests: the product head, but the USB CDC is a text test
; console (ui-freenove/UiTestConsole.cpp: tap / swipe / shot / page /
; status / log) instead of the companion protocol; no companion app link.
; Host side: .superpowers/uitest/ui.py. Not for daily use.
[env:Freenove_S3_35_Head_uitest]
extends = env:Freenove_S3_35_Head_companion_usb
build_unflags = -D ENABLE_USB_INTERFACE
build_flags =
  ${env:Freenove_S3_35_Head_companion_usb.build_flags}
  -D FREENOVE_UITEST=1
build_src_filter = ${env:Freenove_S3_35_Head_companion_usb.build_src_filter}
  +<../examples/companion_radio/ui-freenove/UiTestConsole.cpp>
