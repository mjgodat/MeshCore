[env:ThinkNode_M5_Repeater_bridge_espnow]
extends = ThinkNode_M5
build_src_filter = ${ThinkNode_M5.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ThinkNode_M5.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8
  -D WITH_ESPNOW_BRIDGE=1
  -D WITH_ESPNOW_BRIDGE_SECRET='"shared-secret"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ThinkNode_M5.lib_deps}
  ${esp32_ota.lib_deps}
; Fails the build above 97% of the app slot (flash_budget.py).
extra_scripts =
  ${ThinkNode_M5.extra_scripts}
  post:variants/thinknode_m5/flash_budget.py

; Opt-in: the ESP-NOW bridge repeater plus Cascade's WiFi UDP bridge, so the
; observer feed and the heads' mesh traffic can also ride UDP/IP
; (set observer.transport udp|both). UDP stays off until `set udp.enabled on`.
; The default env above is unchanged.
[env:ThinkNode_M5_Repeater_bridge_espnow_udp]
extends = env:ThinkNode_M5_Repeater_bridge_espnow
; The same table as the M5's shipped Cascade Full firmware (build.sh FULL:
; two 1984 KiB app slots + 64 KiB SPIFFS), so an app-only write at 0x10000
; never meets a different layout. partitions.bin is byte-identical to it.
board_build.partitions = variants/dual_ota_full_4MB.csv
build_src_filter = ${env:ThinkNode_M5_Repeater_bridge_espnow.build_src_filter}
  +<helpers/bridges/UDPBridge.cpp>
  +<helpers/UDPBridgeSettings.cpp>
  +<helpers/esp32/EspNowAwakeWrap.cpp>
build_flags =
  ${env:ThinkNode_M5_Repeater_bridge_espnow.build_flags}
  -D WITH_UDP_BRIDGE=1
  ; Every esp_wifi_set_ps in the image (Arduino's setSleep and STA_START
  ; handler included) goes through the ESP-NOW bridge's awake rule first
  ; (src/helpers/esp32/EspNowAwakeWrap.cpp).
  -D MESH_WRAP_ESP_WIFI_SET_PS=1
  -Wl,--wrap=esp_wifi_set_ps
; Same version scheme as the shipped Cascade Full image (build.sh):
; FIRMWARE_VERSION "<latest repeater tag>-dev-<commit8>" and the UTC build
; date "DD-Mon-YYYY" (scripts/firmware_version_scheme.py).
custom_firmware_tag_prefix = repeater
extra_scripts =
  ${env:ThinkNode_M5_Repeater_bridge_espnow.extra_scripts}
  pre:scripts/firmware_version_env.py

