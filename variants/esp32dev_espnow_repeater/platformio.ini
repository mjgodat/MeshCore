; ----------- ESP32 DevKit ESP-NOW Repeater ------------
; A cheap headless relay: an ordinary MeshCore repeater whose only radio is
; ESP-NOW. Extends ESP-NOW range between heads and a LoRa repeater's ESP-NOW
; bridge. Reuses the generic ESP-NOW target (board, radio, RNG).
; Board: any classic ESP32 DevKit (ESP32-D0WD, 4 MB, no PSRAM).

[ESP32Dev_ESPNOW]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/generic_espnow
  -D MESH_PRIMARY_ESPNOW=1
  ; Shared with the LoRa repeater's ESP-NOW bridge, heads and WiChat.
  -D MESH_ESPNOW_CHANNEL=6
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_USER_BTN=0
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/ESPNOWRadio.cpp>
  +<../variants/generic_espnow>

; Mesh-only repeater (no WiChat). Set the admin password with
; `password <new>` over USB before deploying.
[env:ESP32Dev_ESPNOW_repeater]
extends = ESP32Dev_ESPNOW
build_flags =
  ${ESP32Dev_ESPNOW.build_flags}
  -D ADVERT_NAME='"ESPNOW Relay"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MESH_ESPNOW_RADIO=1
  -D MAX_NEIGHBOURS=50
  ; Repeater power saving light-sleeps after 5 minutes without a USB data
  ; session and wakes on the LoRa radio's interrupt. ESP-NOW cannot wake the
  ; chip, so a relay on a charger would go deaf. Fresh installs start off.
  -D DEFAULT_POWERSAVING_ENABLED=0
  ; Zero-hop "I'm here" advert every 5 minutes over ESP-NOW only, so the LoRa
  ; repeater's bridge can count live relays (`get espnow.nodes`).
  -D ESPNOW_HEARTBEAT_SECS=300
build_src_filter = ${ESP32Dev_ESPNOW.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ESP32Dev_ESPNOW.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
